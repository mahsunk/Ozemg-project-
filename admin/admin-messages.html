<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesajlar — Öz EMG İnşaat Yönetim</title>
  <link rel="stylesheet" href="css/admin.css">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Messages Page Specific Styles */
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0 1.5rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all var(--t) var(--ease);
      background: transparent;
    }
    .filter-tab:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }
    .filter-tab.active {
      background: var(--gold-primary);
      color: var(--bg-primary);
      border-color: var(--gold-primary);
      font-weight: 600;
    }
    
    /* Message List */
    .message-list {
      padding: 0;
    }
    .message-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      transition: all var(--t) var(--ease);
    }
    .message-item:last-child {
      border-bottom: none;
    }
    .message-item:hover {
      background: rgba(255,255,255,0.02);
    }
    .message-item.unread {
      background: rgba(212,175,55,0.04);
      border-left: 3px solid var(--gold-primary);
      padding-left: calc(1.5rem - 3px);
    }
    
    .message-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1rem;
      color: var(--bg-primary);
      flex-shrink: 0;
    }
    .message-avatar.grad-1 { background: linear-gradient(135deg, #d4af37, #b8860b); }
    .message-avatar.grad-2 { background: linear-gradient(135deg, #3498db, #2980b9); }
    .message-avatar.grad-3 { background: linear-gradient(135deg, #27ae60, #1e8449); }
    .message-avatar.grad-4 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .message-avatar.grad-5 { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
    
    .message-content {
      flex: 1;
      min-width: 0;
    }
    .message-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.3rem;
    }
    .message-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.95rem;
    }
    .message-phone {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .message-service {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.6rem;
      border-radius: 50px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .message-service.gold { background: rgba(212,175,55,0.15); color: var(--gold-primary); border: 1px solid rgba(212,175,55,0.25); }
    .message-service.info { background: rgba(52,152,219,0.15); color: var(--info); border: 1px solid rgba(52,152,219,0.25); }
    .message-service.success { background: rgba(39,174,96,0.15); color: var(--success); border: 1px solid rgba(39,174,96,0.25); }
    .message-service.warning { background: rgba(243,156,18,0.15); color: var(--warning); border: 1px solid rgba(243,156,18,0.25); }
    .message-service.danger { background: rgba(231,76,60,0.15); color: var(--danger); border: 1px solid rgba(231,76,60,0.25); }
    
    .message-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 500px;
    }
    .message-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }
    
    .message-status {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.6rem;
      flex-shrink: 0;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.unread {
      background: var(--danger);
      box-shadow: 0 0 8px rgba(231,76,60,0.5);
    }
    .status-dot.read {
      background: var(--text-muted);
      opacity: 0.4;
    }
    .message-actions {
      display: flex;
      gap: 0.4rem;
      opacity: 0;
      transition: opacity var(--t);
    }
    .message-item:hover .message-actions {
      opacity: 1;
    }
    .action-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      transition: all var(--t);
      background: var(--bg-card);
    }
    .action-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      background: rgba(212,175,55,0.08);
    }
    .action-btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(231,76,60,0.08);
    }
    .action-btn svg {
      width: 14px;
      height: 14px;
    }
    
    /* Modal Detail Styles */
    .msg-detail-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .msg-detail-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--bg-primary);
      flex-shrink: 0;
    }
    .msg-detail-info h3 {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      margin-bottom: 0.25rem;
    }
    .msg-detail-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    
    .msg-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .msg-detail-field {
      padding: 0.8rem 1rem;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }
    .msg-detail-field.full-width {
      grid-column: 1 / -1;
    }
    .msg-detail-field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .msg-detail-field p {
      font-size: 0.9rem;
      color: var(--text-primary);
      word-break: break-word;
    }
    
    .msg-detail-message {
      padding: 1.2rem;
      background: var(--bg-tertiary);
      border-radius: var(--radius);
      border: 1px solid var(--border-subtle);
      margin-top: 0.5rem;
    }
    .msg-detail-message label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .msg-detail-message p {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    /* Empty State */
    .empty-messages {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-muted);
    }
    .empty-messages svg {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.2rem;
      opacity: 0.3;
    }
    .empty-messages h3 {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }
    .empty-messages p {
      font-size: 0.9rem;
    }
    
    /* Unread count badge */
    .unread-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      background: rgba(231,76,60,0.1);
      border: 1px solid rgba(231,76,60,0.25);
      border-radius: 50px;
      font-size: 0.78rem;
      color: var(--danger);
      font-weight: 500;
    }
    .unread-count-badge svg {
      width: 14px;
      height: 14px;
    }
    
    /* Result count */
    .result-info {
      padding: 0.6rem 1.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      background: rgba(0,0,0,0.2);
    }
    
    /* Sidebar overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }
    .sidebar-overlay.active { display: block; }
    
    @media (max-width: 768px) {
      .message-preview { max-width: 200px; }
      .msg-detail-grid { grid-template-columns: 1fr; }
      .message-actions { opacity: 1; }
    }
  </style>
</head>

  <script>
    // ==========================================
    // Messages Page Scripts
    // ==========================================
    
    let currentFilter = 'all';
    let currentMessages = [];
    
    document.addEventListener('DOMContentLoaded', async function() {
      // Require authentication
      const session = Admin.requireAuth();
      if (!session) return;
      
      // Initialize all data
      await Admin.initAllData();
      
      // Update sidebar badges
      Admin.updateSidebarBadges();
      
      // Update user info in sidebar
      updateUserInfo(session);
      
      // Load messages
      loadMessages();
      
      // Bind filter tabs
      bindFilterTabs();
      
      // Start clock
      updateClock();
      setInterval(updateClock, 1000);
      
      // Bind sidebar toggle (mobile)
      bindSidebarToggle();
      
      // Close modal on overlay click
      document.getElementById('msgDetailModal').addEventListener('click', function(e) {
        if (e.target === this) {
          Admin.closeModal('msgDetailModal');
        }
      });
    });
    
    // Update user info from session
    function updateUserInfo(session) {
      const userName = document.getElementById('userName');
      const userAvatar = document.getElementById('userAvatar');
      if (userName && session.name) {
        userName.textContent = session.name;
      }
      if (userAvatar && session.name) {
        userAvatar.textContent = Admin.initials(session.name);
      }
    }
    
    // Update clock
    function updateClock() {
      const el = document.getElementById('currentTime');
      if (el) {
        const now = new Date();
        const options = { 
          weekday: 'long', 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric',
          hour: '2-digit', 
          minute: '2-digit'
        };
        el.textContent = now.toLocaleDateString('tr-TR', options);
      }
    }
    
    // Sidebar toggle for mobile
    function bindSidebarToggle() {
      const toggle = document.getElementById('sidebarToggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      if (toggle && sidebar) {
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('open');
          if (overlay) overlay.classList.toggle('active');
        });
      }
      
      if (overlay) {
        overlay.addEventListener('click', () => {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        });
      }
    }
    
    // Load and render messages
    function loadMessages() {
      const allMessages = Admin.getMessages();
      const unreadCount = Admin.unreadCount();
      
      // Update page subtitle
      const subtitle = document.getElementById('pageSubtitle');
      if (unreadCount > 0) {
        subtitle.innerHTML = `<span class="unread-count-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
          </svg>
          ${unreadCount} okunmamış mesaj
        </span>`;
      } else {
        subtitle.textContent = 'Tüm mesajlar okunmuş';
      }
      
      // Filter messages
      filterMessages('all');
    }
    
    // Filter messages by type
    function filterMessages(filter) {
      currentFilter = filter;
      const allMessages = Admin.getMessages();
      
      // Update filter tab active state
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.filter === filter);
      });
      
      // Apply filter
      if (filter === 'unread') {
        currentMessages = allMessages.filter(m => !m.read);
      } else if (filter === 'read') {
        currentMessages = allMessages.filter(m => m.read);
      } else {
        currentMessages = allMessages;
      }
      
      // Sort by createdAt desc
      currentMessages.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      
      // Update result info
      const resultInfo = document.getElementById('resultInfo');
      const filterLabels = { all: 'tüm mesajlar', unread: 'okunmamış mesaj', read: 'okunmuş mesaj' };
      resultInfo.textContent = `${currentMessages.length} ${filterLabels[filter]} gösteriliyor`;
      resultInfo.style.display = 'block';
      
      // Render messages
      renderMessages();
    }
    
    // Bind filter tabs
    function bindFilterTabs() {
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          filterMessages(this.dataset.filter);
        });
      });
    }
    
    // Render messages list
    function renderMessages() {
      const container = document.getElementById('messageList');
      
      if (currentMessages.length === 0) {
        container.innerHTML = `
          <div class="empty-messages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <h3>${currentFilter === 'all' ? 'Henüz mesaj yok' : (currentFilter === 'unread' ? 'Okunmamış mesaj yok' : 'Okunmuş mesaj yok')}</h3>
            <p>${currentFilter === 'all' ? 'Gelen kutusu boş görünüyor.' : (currentFilter === 'unread' ? 'Tüm mesajlarınızı okudunuz!' : 'Henüz okunmuş mesaj bulunmuyor.')}</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = currentMessages.map(msg => {
        const gradClass = `grad-${(msg.name.charCodeAt(0) % 5) + 1}`;
        const serviceClass = Admin.catColor(msg.service);
        const serviceLabel = Admin.catLabel(msg.service);
        const initialsStr = Admin.initials(msg.name);
        const preview = msg.message.length > 80 ? msg.message.substring(0, 80) + '...' : msg.message;
        const timeAgo = Admin.timeAgo(msg.createdAt);
        const fullDate = Admin.formatDateTime(msg.createdAt);
        
        return `
          <div class="message-item ${msg.read ? '' : 'unread'}" data-id="${msg.id}" onclick="openMessageDetail('${msg.id}')">
            <div class="message-avatar ${gradClass}">${initialsStr}</div>
            <div class="message-content">
              <div class="message-header">
                <span class="message-name">${escapeHtml(msg.name)}</span>
                <span class="message-phone">${escapeHtml(msg.phone)}</span>
                <span class="message-service ${serviceClass}">${serviceLabel}</span>
              </div>
              <div class="message-preview">${escapeHtml(preview)}</div>
              <div class="message-time" title="${fullDate}">${timeAgo}</div>
            </div>
            <div class="message-status">
              <div class="status-dot ${msg.read ? 'read' : 'unread'}" title="${msg.read ? 'Okunmuş' : 'Okunmamış'}"></div>
              <div class="message-actions">
                <button class="action-btn" onclick="event.stopPropagation(); toggleReadStatus('${msg.id}')" title="${msg.read ? 'Okundu olarak işaretle' : 'Okunmadı olarak işaretle'}">
                  ${msg.read ? 
                    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>` :
                    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/></svg>`
                  }
                </button>
                <button class="action-btn danger" onclick="event.stopPropagation(); deleteMsg('${msg.id}')" title="Sil">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // Open message detail modal
    function openMessageDetail(id) {
      const messages = Admin.getMessages();
      const msg = messages.find(m => String(m.id) === String(id));
      if (!msg) return;
      
      // Mark as read if unread
      if (!msg.read) {
        Admin.markRead(id);
        Admin.updateSidebarBadges();
        renderMessages();
        // Update subtitle
        const unreadCount = Admin.unreadCount();
        const subtitle = document.getElementById('pageSubtitle');
        if (unreadCount > 0) {
          subtitle.innerHTML = `<span class="unread-count-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
            </svg>
            ${unreadCount} okunmamış mesaj
          </span>`;
        } else {
          subtitle.textContent = 'Tüm mesajlar okunmuş';
        }
      }
      
      const gradClass = `grad-${(msg.name.charCodeAt(0) % 5) + 1}`;
      const serviceClass = Admin.catColor(msg.service);
      const serviceLabel = Admin.catLabel(msg.service);
      const initialsStr = Admin.initials(msg.name);
      const fullDate = Admin.formatDateTime(msg.createdAt);
      
      // Render modal body
      const modalBody = document.getElementById('msgDetailBody');
      modalBody.innerHTML = `
        <div class="msg-detail-header">
          <div class="msg-detail-avatar message-avatar ${gradClass}" style="width:52px;height:52px;font-size:1.1rem;">
            ${initialsStr}
          </div>
          <div class="msg-detail-info">
            <h3>${escapeHtml(msg.name)}</h3>
            <p>${fullDate} • <span class="message-service ${serviceClass}" style="display:inline;">${serviceLabel}</span></p>
          </div>
        </div>
        
        <div class="msg-detail-grid">
          <div class="msg-detail-field">
            <label>Telefon</label>
            <p>${escapeHtml(msg.phone)}</p>
          </div>
          <div class="msg-detail-field">
            <label>E-posta</label>
            <p>${msg.email ? escapeHtml(msg.email) : '<em style="color:var(--text-muted);">Belirtilmedi</em>'}</p>
          </div>
          <div class="msg-detail-field">
            <label>Hizmet Türü</label>
            <p><span class="message-service ${serviceClass}">${serviceLabel}</span></p>
          </div>
          <div class="msg-detail-field">
            <label>Lokasyon</label>
            <p>${escapeHtml(msg.location)}</p>
          </div>
        </div>
        
        <div class="msg-detail-message">
          <label>Mesaj</label>
          <p>${escapeHtml(msg.message)}</p>
        </div>
      `;
      
      // Render modal footer with action buttons
      const modalFooter = document.getElementById('msgDetailFooter');
      modalFooter.innerHTML = `
        <button class="btn btn--outline btn--sm" onclick="Admin.closeModal('msgDetailModal')">Kapat</button>
        <button class="btn ${msg.read ? 'btn--success' : 'btn--gold'} btn--sm" onclick="toggleReadStatus('${msg.id}'); Admin.closeModal('msgDetailModal');">
          ${msg.read ? 
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:4px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Okunmadı İşaretle` :
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:4px;"><polyline points="20 6 9 17 4 12"/></svg> Okundu İşaretle`
          }
        </button>
        <button class="btn btn--danger btn--sm" onclick="deleteMsg('${msg.id}'); Admin.closeModal('msgDetailModal');">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:4px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Sil
        </button>
      `;
      
      // Open modal
      Admin.openModal('msgDetailModal');
    }
    
    // Toggle read/unread status
    function toggleReadStatus(id) {
      const messages = Admin.getMessages();
      const idx = messages.findIndex(m => String(m.id) === String(id));
      if (idx === -1) return;
      
      // Toggle read status (backend'e de yazılır)
      const newRead = !messages[idx].read;
      Admin.setMessageRead(id, newRead);
      
      // Re-render
      renderMessages();
      Admin.updateSidebarBadges();
      
      // Update subtitle
      const unreadCount = Admin.unreadCount();
      const subtitle = document.getElementById('pageSubtitle');
      if (unreadCount > 0) {
        subtitle.innerHTML = `<span class="unread-count-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
          </svg>
          ${unreadCount} okunmamış mesaj
        </span>`;
      } else {
        subtitle.textContent = 'Tüm mesajlar okunmuş';
      }
      
      // Show toast
      Admin.toast(messages[idx].read ? 'Mesaj okundu olarak işaretlendi.' : 'Mesaj okunmadı olarak işaretlendi.', 'success');
      
      // Re-filter if needed
      if (currentFilter !== 'all') {
        filterMessages(currentFilter);
      }
    }
    
    // Delete message
    async function deleteMsg(id) {
      const confirmed = await Admin.confirm('Bu mesajı silmek istediğinize emin misiniz? Bu işlem geri alınamaz.');
      if (!confirmed) return;
      
      Admin.deleteMessage(id);
      
      // Re-render
      renderMessages();
      Admin.updateSidebarBadges();
      
      // Update subtitle
      const unreadCount = Admin.unreadCount();
      const subtitle = document.getElementById('pageSubtitle');
      if (unreadCount > 0) {
        subtitle.innerHTML = `<span class="unread-count-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
          </svg>
          ${unreadCount} okunmamış mesaj
        </span>`;
      } else {
        subtitle.textContent = 'Tüm mesajlar okunmuş';
      }
      
      // Show toast
      Admin.toast('Mesaj silindi.', 'success');
      
      // Re-filter if needed
      if (currentFilter !== 'all') {
        filterMessages(currentFilter);
      }
    }
    
    // Escape HTML helper
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
